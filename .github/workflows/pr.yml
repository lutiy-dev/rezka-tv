name: Быстрые проверки

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: fast-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.2 typos==1.51.1
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew verify
        env:
          PYTHON: python
          GATE_BASE: origin/${{ github.base_ref || 'main' }}

      - name: Build QA APK
        if: github.head_ref == 'test/1.2.0-qa-apk' || github.head_ref == 'test/1.2.0-playback-baseline'
        run: ./gradlew assembleDebug
      - name: Upload QA APK
        if: github.head_ref == 'test/1.2.0-qa-apk' || github.head_ref == 'test/1.2.0-playback-baseline'
        uses: actions/upload-artifact@v7
        with:
          name: Rezka-TV-1.2.0-${{ github.head_ref == 'test/1.2.0-playback-baseline' && 'Playback-Baseline' || 'QA' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
