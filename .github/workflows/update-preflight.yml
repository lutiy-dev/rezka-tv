name: Signed update preflight

on:
  push:
    branches: [release/preflight-1.2.7]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REZKA_VERSION_NAME: "1.2.7"
      REZKA_VERSION_CODE: "22"
      GATE_BASE: origin/feat/best-live-qa-1.2.6-v2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.2 typos==1.51.1
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install release build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore existing production key
        env:
          KEYSTORE_B64: ${{ secrets.REZKA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REZKA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REZKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REZKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | sed 's/^REZKA_KEYSTORE_B64=//' | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/rezka-production.jks"
          test -s "$RUNNER_TEMP/rezka-production.jks"
          {
            echo "storeFile=$RUNNER_TEMP/rezka-production.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties "$RUNNER_TEMP/rezka-production.jks"
      - name: Verify and build signed production variant
        run: ./gradlew verify lintRelease assembleRelease
        env:
          PYTHON: python
      - name: Check update compatibility with published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-release
          LATEST_TAG="$(gh release view --json tagName --jq '.tagName')"
          test "$LATEST_TAG" = "v1.2.6"
          gh release download "$LATEST_TAG" --pattern '*.apk' --dir previous-release
          mapfile -t OLD < <(find previous-release -maxdepth 1 -name '*.apk' -type f)
          test "${#OLD[@]}" -eq 1
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/apksigner" verify "${OLD[0]}"
          NEW_CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          OLD_CERT="$("$TOOLS/apksigner" verify --print-certs "${OLD[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          "$TOOLS/aapt" dump badging "$APK" > new-badging.txt
          "$TOOLS/aapt" dump badging "${OLD[0]}" > old-badging.txt
          NEW_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" new-badging.txt)"
          OLD_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" old-badging.txt)"
          NEW_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" new-badging.txt)"
          OLD_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" old-badging.txt)"
          NEW_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" new-badging.txt)"
          test "$NEW_ID" = "dev.alaev.rezkatv"
          test "$NEW_ID" = "$OLD_ID"
          test "$NEW_CODE" -gt "$OLD_CODE"
          test "$NEW_CODE" = "$REZKA_VERSION_CODE"
          test "$NEW_NAME" = "$REZKA_VERSION_NAME"
          diff <(grep -E '^(sdkVersion|targetSdkVersion|native-code):' old-badging.txt) <(grep -E '^(sdkVersion|targetSdkVersion|native-code):' new-badging.txt)
          "$TOOLS/aapt" list "$APK" > apk-entries.txt
          if grep -Ei '(^|/)(keystore.properties|local.properties|\.env|[^/]+\.(jks|keystore|pem))$' apk-entries.txt; then exit 1; fi
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "PREVIOUS_TAG=$LATEST_TAG"
            echo "APPLICATION_ID=$NEW_ID"
            echo "PREVIOUS_VERSION_CODE=$OLD_CODE"
            echo "VERSION_CODE=$NEW_CODE"
            echo "VERSION_NAME=$NEW_NAME"
            echo "CERTIFICATE_SHA256=$NEW_CERT"
            echo "SIGNATURE_COMPATIBILITY=PASS"
            echo "DEVICE_QA=NOT_TESTED"
            sha256sum "$APK"
          } | tee release-evidence.txt
          cp "$APK" "Rezka-TV-1.2.7-candidate.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: Rezka-TV-1.2.7-signed-candidate
          path: |
            Rezka-TV-1.2.7-candidate.apk
            release-evidence.txt
            new-badging.txt
            old-badging.txt
          if-no-files-found: error
