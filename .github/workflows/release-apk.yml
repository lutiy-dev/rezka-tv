name: Release Rezka TV APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.1.1
        required: true
        default: '1.2.7'
  push:
    branches:
      - 'release/**'
    paths:
      - '.release/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REZKA_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Resolve release version
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          VERSION_NAME="${VERSION_INPUT:-${GITHUB_REF_NAME#release/}}"
          printf '%s\n' "$VERSION_NAME" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'
          echo "REZKA_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install ruff==0.17.2 typos==1.51.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.REZKA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REZKA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REZKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REZKA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.REZKA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REZKA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REZKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REZKA_KEY_PASSWORD }}
        run: |
          CLEAN_KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | sed 's/^REZKA_KEYSTORE_B64=//' | tr -d '\r\n\t ')"
          printf '%s' "$CLEAN_KEYSTORE_B64" | base64 --decode > rezka-tv-release.jks
          test -s rezka-tv-release.jks
          cat > keystore.properties <<EOF
          storeFile=rezka-tv-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build signed Release APK
        run: ./gradlew verify lintRelease assembleRelease
        env:
          PYTHON: python
          GATE_BASE: origin/main

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify signing certificate against latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-release
          LATEST_TAG="$(gh release view --json tagName --jq '.tagName')"
          test -n "$LATEST_TAG"
          gh release download "$LATEST_TAG" --pattern '*.apk' --dir previous-release
          mapfile -t PREVIOUS_APKS < <(find previous-release -maxdepth 1 -type f -name '*.apk')
          test "${#PREVIOUS_APKS[@]}" -eq 1
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          CURRENT_APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify "$CURRENT_APK"
          "$APKSIGNER" verify "${PREVIOUS_APKS[0]}"
          CURRENT_CERT="$("$APKSIGNER" verify --print-certs "$CURRENT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          PREVIOUS_CERT="$("$APKSIGNER" verify --print-certs "${PREVIOUS_APKS[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CURRENT_CERT"
          test -n "$PREVIOUS_CERT"
          if [ "$CURRENT_CERT" != "$PREVIOUS_CERT" ]; then
            echo "::error::APK signing certificate differs from latest published release ($LATEST_TAG); refusing publication"
            exit 1
          fi
          echo "Signing certificate matches latest release ($LATEST_TAG)."
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$CURRENT_APK" > current-badging.txt
          "$AAPT" dump badging "${PREVIOUS_APKS[0]}" > previous-badging.txt
          NEW_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" current-badging.txt)"
          OLD_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" previous-badging.txt)"
          NEW_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" current-badging.txt)"
          OLD_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" previous-badging.txt)"
          NEW_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" current-badging.txt)"
          test "$NEW_ID" = "dev.alaev.rezkatv"
          test "$NEW_ID" = "$OLD_ID"
          test "$NEW_CODE" -gt "$OLD_CODE"
          test "$NEW_CODE" = "$REZKA_VERSION_CODE"
          test "$NEW_NAME" = "$REZKA_VERSION_NAME"
          python -c 'import sys; v=lambda s: tuple(map(int,s.removeprefix("v").split("."))); assert v(sys.argv[1])>v(sys.argv[2])' "$NEW_NAME" "$LATEST_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          diff <(grep -E '^(sdkVersion|targetSdkVersion|native-code):' previous-badging.txt) <(grep -E '^(sdkVersion|targetSdkVersion|native-code):' current-badging.txt)
          "$AAPT" list "$CURRENT_APK" > apk-entries.txt
          if grep -Ei '(^|/)(keystore.properties|local.properties|\.env|[^/]+\.(jks|keystore|pem))$' apk-entries.txt; then exit 1; fi
          echo "UPDATE_PASS applicationId=$NEW_ID versionCode=$OLD_CODE->$NEW_CODE versionName=$NEW_NAME certificate=$CURRENT_CERT"
          sha256sum "$CURRENT_APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${REZKA_VERSION_NAME}"
          ASSET="Rezka-TV-${REZKA_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          printf '{"version":"%s","apkUrl":"https://github.com/lutiy-dev/rezka-tv/releases/download/%s/%s"}\n' \
            "$REZKA_VERSION_NAME" "$TAG" "$ASSET" > update.json
          gh release create "$TAG" "$ASSET" update.json \
            --target "$GITHUB_SHA" \
            --title "Rezka TV ${REZKA_VERSION_NAME}" \
            --notes-file ".release/notes-${REZKA_VERSION_NAME}.md"
          mkdir published
          gh release download "$TAG" --pattern "$ASSET" --pattern update.json --dir published
          cmp "$ASSET" "published/$ASSET"
          cmp update.json published/update.json
