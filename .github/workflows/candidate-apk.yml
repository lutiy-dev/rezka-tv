name: Build signed candidate APK

on:
  push:
    branches:
      - feature/1.1.5-stability-mobile-ux
    paths:
      - '.github/workflows/candidate-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REZKA_VERSION_CODE: '13'
      REZKA_VERSION_NAME: '1.1.5-rc1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.REZKA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REZKA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REZKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REZKA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          CLEAN_KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | sed 's/^REZKA_KEYSTORE_B64=//' | tr -d '\r\n\t ')"
          printf '%s' "$CLEAN_KEYSTORE_B64" | base64 --decode > rezka-tv-release.jks
          test -s rezka-tv-release.jks
          cat > keystore.properties <<EOF
          storeFile=rezka-tv-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Test and build candidate
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease
      - name: Verify candidate version
        run: |
          aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -F "versionCode='13'"
          aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -F "versionName='1.1.5-rc1'"
      - name: Upload candidate APK (not a Release)
        uses: actions/upload-artifact@v7
        with:
          name: Rezka-TV-1.1.5-rc1-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
